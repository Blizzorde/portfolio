<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arxher | Digital Portolio</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/contact.css" />
    <link rel="icon" href="./img/favicon.png" type="image/png" />
    <script
      src="https://kit.fontawesome.com/5f8a667392.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="page-container">
      <section class="main-container contact">
        <header class="nav-wrapper">
          <nav class="nav-container">
            <a href="./index.html" class="nav-link">Home</a>
            <a href="./about.html" class="nav-link">About</a>
            <a href="./index.html" class="nav-link-logo"
              ><img class="logo" src="./img/logo.png" alt="ARCHER" />
            </a>
            <a href="./work.html" class="nav-link">Work</a>
            <a href="./contact.html" class="nav-link active">Contact</a>
          </nav>
        </header>

        <main class="contact-section">
          <div class="contact-title">
            <h5 class="section-superheadline">Get In Touch</h5>
            <h1 class="section-title left">Contact</h1>
          </div>
          <div class="contact-content">
            <div class="callouts">
              <div class="callout-card glass-card">
                <div class="icon-container">
                  <div class="icon-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                  </div>
                </div>
                <div class="text">Email Me</div>
                <div class="val">
                  <a
                    href="mailto:archer.spoken001@passmail.net&subject=test&body=testifn"
                    >archer.spoken001@passmail.net</a
                  >
                </div>
              </div>
              <div class="callout-card glass-card">
                <div class="icon-container">
                  <div class="icon-wrapper">
                    <i class="fa-solid fa-clock"></i>
                  </div>
                </div>
                <div class="text">Availability</div>
                <div class="val">24/7</div>
              </div>
              <div class="callout-card glass-card">
                <div class="icon-container">
                  <div class="icon-wrapper">
                    <i class="fa-solid fa-location-dot"></i>
                  </div>
                </div>
                <div class="text">Location</div>
                <div class="val">Suriname + International Virtually</div>
              </div>
            </div>
            <div class="contact-form-container glass-card">
              <form>
                <div class="control-group">
                  <label for="full-name">Full Name*</label>
                  <input
                    name="full-name"
                    id="full-name"
                    type="text"
                    max="25"
                    required
                    placeholder="John Doe"
                  />
                </div>
                <div class="control-group">
                  <label for="email-address">Email Address*</label>
                  <input
                    name="email-address"
                    id="email-address"
                    type="email"
                    max="25"
                    required
                    placeholder="john.doe@official.com"
                  />
                </div>
                <div class="control-group">
                  <label for="subject">Subject*</label>
                  <input
                    name="subject"
                    id="subject"
                    type="text"
                    max="25"
                    required
                    placeholder="How can I help you?"
                  />
                </div>
                <div class="control-group">
                  <label for="message">Message*</label>
                  <textarea
                    name="message"
                    id="message"
                    max="25"
                    rows="4"
                    required
                    placeholder="Your message here..."
                  ></textarea>
                </div>
                <button class="cta-link primary" type="submit">
                  Send Message <i class="fa-solid fa-arrow-right"></i>
                </button>
              </form>
            </div>
          </div>
        </main>
      </section>
    </div>
  </body>
</html>
